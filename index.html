<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Musii</title>
  <meta name="description" content="Musii – kostenloser Musik-Player mit Millionen freier Songs unabhängiger Artists." />
  <meta name="theme-color" content="#0d0b14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <img src="icon.svg" alt="" width="32" height="32" />
        <span>Musii</span>
      </a>
      <nav class="nav">
        <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Start</span></a>
        <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Suchen</span></a>
        <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.6 1.9-.6 5.6 17.2-1.9.6z"/></svg><span>Bibliothek</span></a>
      </nav>
      <div class="sidebar-section">
        <button class="side-btn" id="newPlaylistBtn"><span class="plus">+</span> Playlist erstellen</button>
        <a class="side-btn" href="#/liked"><span class="heart-tile">♥</span> Lieblingssongs</a>
        <a class="side-btn" href="#/local"><span class="local-tile">♪</span> Eigene Dateien</a>
      </div>
      <div class="side-playlists" id="sidePlaylists"></div>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <header class="topbar">
        <div class="history">
          <button class="round" onclick="history.back()" aria-label="Zurück">‹</button>
          <button class="round" onclick="history.forward()" aria-label="Vor">›</button>
        </div>
        <form class="searchbox" id="searchForm" autocomplete="off">
          <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          <input id="searchInput" type="search" placeholder="Was möchtest du hören?" />
        </form>
      </header>
      <div class="view" id="view"></div>
    </main>

    <!-- Queue panel -->
    <aside class="queue-panel" id="queuePanel" hidden>
      <div class="queue-head"><h3>Warteschlange</h3><button class="icon" id="closeQueue" aria-label="Schließen">✕</button></div>
      <div id="queueList"></div>
    </aside>
  </div>

  <!-- Player -->
  <footer class="player" id="player">
    <div class="now" id="nowInfo">
      <img id="npArt" class="np-art" alt="" />
      <div class="np-text">
        <div class="np-title" id="npTitle">Nichts wird gespielt</div>
        <div class="np-artist" id="npArtist">Wähle einen Song</div>
      </div>
      <button class="icon like" id="npLike" aria-label="Gefällt mir">♡</button>
    </div>
    <div class="controls">
      <div class="buttons">
        <button class="icon" id="shuffleBtn" title="Zufallswiedergabe (S)"><svg viewBox="0 0 24 24"><path d="M17 3h4v4h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H17zM3 5.4 4.4 4l15.6 15.6V18h2v4h-4v-2h1.6L3 5.4zm10.3 9.3 1.4-1.4 2.9 2.9-1.4 1.4z"/></svg></button>
        <button class="icon" id="prevBtn" title="Zurück"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
        <button class="play-btn" id="playBtn" title="Play/Pause (Leertaste)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon" id="nextBtn" title="Weiter"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z"/></svg></button>
        <button class="icon" id="repeatBtn" title="Wiederholen (R)"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><span class="badge" id="repeatOne" hidden>1</span></button>
      </div>
      <div class="progress">
        <span id="curTime">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" />
        <span id="durTime">0:00</span>
      </div>
    </div>
    <div class="extras">
      <button class="icon" id="queueBtn" title="Warteschlange"><svg viewBox="0 0 24 24"><path d="M3 5h13v2H3zm0 6h13v2H3zm0 6h9v2H3zm15-4v6l5-3z"/></svg></button>
      <button class="icon" id="muteBtn" title="Stumm (M)"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
      <input type="range" id="volume" min="0" max="100" value="80" />
      <button class="icon" id="fullBtn" title="Vollbild-Player"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </footer>

  <!-- Mobile nav -->
  <nav class="mobile-nav">
    <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Start</a>
    <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>Suchen</a>
    <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.6 1.9-.6 5.6 17.2-1.9.6z"/></svg>Bibliothek</a>
  </nav>

  <!-- Fullscreen now playing -->
  <div class="fullscreen" id="fullscreen" hidden>
    <div class="fs-bg" id="fsBg"></div>
    <button class="icon fs-close" id="fsClose" aria-label="Schließen">⌄</button>
    <div class="fs-inner">
      <canvas id="viz" class="viz"></canvas>
      <img id="fsArt" class="fs-art" alt="" />
      <h2 id="fsTitle"></h2>
      <p id="fsArtist"></p>
    </div>
  </div>

  <!-- Context menu & toast -->
  <div class="menu" id="menu" hidden></div>
  <div class="toast" id="toast"></div>

  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  <input type="file" id="fileInput" accept="audio/*" multiple hidden />

  <script src="app.js"></script>
</body>
</html>
