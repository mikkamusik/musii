name: Musii Studio (Android-App)

on:
  push:
    paths:
      - 'MusiiAndroid/**'
      - '.github/workflows/musii-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musii-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: MusiiAndroid
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Release-APK benennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MusiiStudio-Android-1.0.${BUILD_NUMBER}.apk"
          ls -la dist

      - name: Bibliotheken für den Emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 > /dev/null

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator-Tests (Export, Effekte, Bildschirmfotos)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          working-directory: MusiiAndroid
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.musii.studio.test/androidx.test.runner.AndroidJUnitRunner | tee test-log.txt
            mkdir -p test-out && adb pull /sdcard/Android/data/com.musii.studio/files/test-out ./test-out || true
            adb logcat -d '*:W' MusiiTest:V > test-out/logcat.txt || true
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.musii.studio/.MainActivity
            sleep 5
            adb exec-out screencap -p > test-out/release-start.png || true
            adb shell pidof com.musii.studio > test-out/release-pid.txt || true
            grep -q "FAILURES!!!" test-log.txt && exit 1 || true
            grep -q "OK (" test-log.txt

      - name: APK hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusiiStudio-Android-apk
          path: MusiiAndroid/dist/*.apk
          if-no-files-found: ignore

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusiiStudio-Android-tests
          path: |
            MusiiAndroid/test-out
            MusiiAndroid/test-log.txt
          if-no-files-found: ignore
