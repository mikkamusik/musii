<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16181d">
  <title>Musii</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #boot { position: fixed; inset: 0; z-index: 500; background: #16181d; color: #e8e9ec; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; font: 15px system-ui, sans-serif; text-align: center; padding: 20px; }
    #boot b { font-size: 22px; letter-spacing: 1px; }
    #boot .err { color: #ffb347; font: 12px monospace; white-space: pre-wrap; max-width: 92vw; max-height: 50vh; overflow: auto; text-align: left; }
    #boot button { background: #ffb347; color: #1a1406; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; }
  </style>
  <script>
    /* Show any startup error on screen instead of a blank page */
    window.__bootErrors = [];
    function __bootFail(msg) {
      window.__bootErrors.push(msg);
      var b = document.getElementById('boot');
      if (!b) return;
      b.innerHTML = '<b>musii</b><div>Beim Start ist ein Fehler aufgetreten.</div><div class="err"></div>' +
        '<div><button onclick="location.reload()">Neu laden</button> <button onclick="__resetApp()">Zurücksetzen</button></div>';
      b.querySelector('.err').textContent = window.__bootErrors.join('\n');
      b.style.display = 'flex';
    }
    function __resetApp() {
      try { indexedDB.deleteDatabase('musii'); } catch (e) {}
      setTimeout(function () { location.reload(); }, 300);
    }
    window.addEventListener('error', function (e) { if (!window.__booted) __bootFail((e.message || 'Fehler') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { if (!window.__booted) __bootFail('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    setTimeout(function () { if (!window.__booted && !window.__bootErrors.length) __bootFail('Start dauert zu lange (Timeout).'); }, 12000);
  </script>
</head>
<body>
  <div id="boot"><b>musii</b><div>Lädt …</div></div>
  <div id="app">
    <header id="topbar"></header>
    <main id="main"></main>
    <section id="panel">
      <div id="panelTabs"></div>
      <div id="panelBody"></div>
    </section>
  </div>
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/als.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/ui-session.js"></script>
  <script src="js/ui-arrange.js"></script>
  <script src="js/ui-mixer.js"></script>
  <script src="js/ui-editor.js"></script>
  <script src="js/ui-devices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
