<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8322D">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>MöbelFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Fitness-App für zu Hause: deine Möbel als Trainingsgeräte, mit Video-Workouts.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: phone-first single column (max 600px), sticky header, fixed bottom tab bar,
   fullscreen dark "video" player. Palette from a dartboard (red / green / cream / black)
   on the apartment's white walls, anthracite countertop and oak floor. */
:root {
  --bg: #F1F2EF; --surface: #FFFFFF; --surface-2: #E6E8E3; --ink: #1D1F23; --ink-2: #5A5F67; --line: #D7DAD3;
  --red: #C8322D; --red-soft: #F6DEDB; --on-red: #FFFFFF; --green: #17784A; --green-soft: #DCEFE3;
  --cream: #EFE4CC; --board: #1B1C1F; --oak: #CFA67C;
  --st-wall: #ECEDEA; --st-wall2: #E0E2DD; --st-floor: #CFA67C; --st-base: #F8F8F6; --st-seam: #B88E64;
  --fig-skin: #E3A983; --fig-skin-far: #C98E6A; --fig-pants: #2A2D33; --fig-pants-far: #17191D;
  --fig-shirt: #C8322D; --fig-hair: #2B211C; --fig-shoe: #F4F4F1; --fig-shoe-far: #D9D9D4;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --surface: #1E2023; --surface-2: #292C30; --ink: #EEEFEC; --ink-2: #A4A9B0; --line: #33363B;
    --red: #E2463D; --red-soft: #3A1E1C; --on-red: #FFFFFF; --green: #2EA368; --green-soft: #17301F;
    --cream: #E4D9C1; --board: #0E0F10; --oak: #9B7550;
    --st-wall: #24262A; --st-wall2: #2C2F33; --st-floor: #7A5B40; --st-base: #3A3D42; --st-seam: #634934;
    --fig-skin: #E3A983; --fig-skin-far: #B9825F; --fig-pants: #D7DADF; --fig-pants-far: #A3A7AE;
    --fig-shirt: #E2463D; --fig-hair: #120D0A; --fig-shoe: #F4F4F1; --fig-shoe-far: #C9C9C4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --surface: #1E2023; --surface-2: #292C30; --ink: #EEEFEC; --ink-2: #A4A9B0; --line: #33363B;
  --red: #E2463D; --red-soft: #3A1E1C; --on-red: #FFFFFF; --green: #2EA368; --green-soft: #17301F;
  --cream: #E4D9C1; --board: #0E0F10; --oak: #9B7550;
  --st-wall: #24262A; --st-wall2: #2C2F33; --st-floor: #7A5B40; --st-base: #3A3D42; --st-seam: #634934;
  --fig-skin: #E3A983; --fig-skin-far: #B9825F; --fig-pants: #D7DADF; --fig-pants-far: #A3A7AE;
  --fig-shirt: #E2463D; --fig-hair: #120D0A; --fig-shoe: #F4F4F1; --fig-shoe-far: #C9C9C4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 34px; text-transform: uppercase; }
h3 { font-size: 24px; text-transform: uppercase; }
p { margin: 0; }
.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 26px; text-transform: uppercase; letter-spacing: 0.02em; }
.brand svg { width: 28px; height: 28px; }
.brand b { color: var(--red); font-weight: 900; }
.top .date { margin-left: auto; font-size: 13px; color: var(--ink-2); text-align: right; }

main { padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); }
.view { display: flex; flex-direction: column; gap: 28px; padding-block: 18px 8px; }
.view[hidden] { display: none !important; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Stage */
.stage { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; max-width: 100%; }
.stage polyline, .stage line, .stage path { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fa-far { stroke: var(--fig-skin-far); stroke-width: 9.5; } .fa-near { stroke: var(--fig-skin); stroke-width: 10; }
.fl-far { stroke: var(--fig-pants-far); stroke-width: 13; } .fl-near { stroke: var(--fig-pants); stroke-width: 13.5; }
.ff-far { stroke: var(--fig-shoe-far); stroke-width: 8; } .ff-near { stroke: var(--fig-shoe); stroke-width: 8; }
.ftorso { stroke: var(--fig-shirt); stroke-width: 25; } .fhip { fill: var(--fig-pants); }
.fhair { fill: var(--fig-hair); } .fface, .fhand { fill: var(--fig-skin); }
.p-wood { fill: #C79F72; } .p-wood-far { fill: #A98257; } .p-wood-d { fill: #3A3B3F; }
.p-uph { fill: #F2EFE8; stroke: #CFC8BA; stroke-width: 1.5; } .p-sofa { fill: #7D8088; } .p-sofa-d { fill: #5F626A; }
.p-top { fill: #2F3135; } .p-cab { fill: #FBFBF9; stroke: #D3D3CD; stroke-width: 1.5; } .p-plinth { fill: #E4E4DF; }
.stage .p-handle { stroke: #8E9196; stroke-width: 3; } .p-tile { fill: #3A3C41; }
.p-wall { fill: var(--st-wall2); } .p-base { fill: var(--st-base); }
.p-frame { fill: #E9E8E3; stroke: #CFCDC6; } .p-door { fill: #F6F5F1; stroke: #D6D4CC; } .p-knob { fill: #9A9CA0; } .p-anchor { fill: #1E1F22; }
.stage .p-bar, .stage .p-bar-far { stroke: #1E1F22; stroke-width: 4; } .p-foam { fill: #26282B; stroke: #3DBB5B; stroke-width: 2; } .p-foam-s { fill: #3DBB5B; }
.a-db { fill: #1D1E21; } .a-db-hi { fill: #4A4C51; }
.a-towel { fill: #FAFAF7; stroke: #7D7D78; stroke-width: 1; } .stage .a-towel-s { stroke: #C8322D; stroke-width: 1.4; stroke-dasharray: 3 3; }
.a-pillow { fill: #F3F0F4; stroke: #7B3B7E; stroke-width: 1.5; } .stage .a-pillow-s { stroke: #7B3B7E; stroke-width: 3; }
.stage .a-band { stroke: #D9473C; stroke-width: 3.5; } .stage .a-band2 { stroke: #2F6FD0; stroke-width: 3; } .a-grip { fill: #1E1F22; }
.stage .a-rope { stroke: var(--ink-2); stroke-width: 2.2; } .a-ropeh { fill: #1E1F22; }
.st-wall { fill: var(--st-wall); } .st-floor { fill: var(--st-floor); } .st-base { fill: var(--st-base); }
.stage .st-seam { stroke: var(--st-seam); stroke-width: 1; } .st-shadow { fill: #000; opacity: 0.12; }

/* Hero */
.hero { display: grid; gap: 14px; }
.hero h1 { font-size: clamp(44px, 13vw, 68px); text-transform: uppercase; line-height: 0.92; }
.hero h1 em { font-style: normal; color: var(--red); }
.hero-stage { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--st-wall); }
.hero-stage .tag { position: absolute; left: 12px; top: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: var(--surface); color: var(--ink); padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); }
.hero p.lead { font-size: 16px; color: var(--ink-2); max-width: 46ch; }
.today { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 14px 16px; }
.today .t1 { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; font-weight: 700; }
.today .t2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; text-transform: uppercase; line-height: 1.05; }
.today .t3 { font-size: 13px; opacity: 0.8; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 99px; padding: 11px 18px; font-weight: 700; font-size: 15px; background: var(--surface-2); color: var(--ink); min-height: 44px; }
.btn.red { background: var(--red); color: var(--on-red); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn svg { width: 18px; height: 18px; }
.btn.play { width: 52px; height: 52px; padding: 0; background: var(--red); color: var(--on-red); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.stat .v { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--ink-2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .d { text-align: center; font-size: 11px; color: var(--ink-2); display: grid; gap: 4px; justify-items: center; }
.week .dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.week .on .dot { background: var(--green); border: 0; color: #fff; }
.week .today-d .dot { border-color: var(--red); border-style: solid; }

/* Inventory */
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { display: grid; grid-template-rows: auto 1fr; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; padding: 0; }
.item .ph { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--ink-2); }
.item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .ph svg { width: 54px; height: 54px; }
.item .tx { padding: 8px 10px 10px; display: grid; gap: 2px; }
.item .nm { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.item .nm span { color: var(--red); font-family: var(--font-display); font-size: 17px; line-height: 1.1; }
.item .nt { font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.item .cnt { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.04em; text-transform: uppercase; }

.note { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); display: grid; gap: 8px; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.note li { font-size: 14px; }
.teaser { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: left; width: 100%; }
.teaser .big { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 0.9; color: var(--red); font-variant-numeric: tabular-nums; }

/* Workout cards */
.wlist { display: grid; gap: 14px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; }
.wcard .top-row { display: grid; grid-template-columns: 132px minmax(0, 1fr); }
.wcard .mini { background: var(--st-wall); border-right: 1px solid var(--line); display: grid; align-items: center; }
.wcard .info { padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.wcard h3 { font-size: 26px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--ink-2); align-items: center; }
.lvl { display: inline-flex; gap: 3px; vertical-align: middle; }
.lvl i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.lvl i.on { background: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink); border: 0; white-space: nowrap; }
.wcard .actions { display: flex; gap: 8px; padding: 0 14px 14px; flex-wrap: wrap; }
.wcard details { border-top: 1px solid var(--line); }
.wcard summary { padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.wcard summary::after { content: "+"; font-weight: 700; color: var(--ink-2); }
.wcard details[open] summary::after { content: "–"; }
.wcard ol { margin: 0; padding: 0 14px 14px 34px; display: grid; gap: 4px; font-size: 14px; }
.wcard ol .s { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Exercise grid */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.filters::-webkit-scrollbar { display: none; }
.filters .chip { padding: 8px 13px; font-size: 13px; cursor: pointer; border: 1.5px solid transparent; }
.filters .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.excard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; padding: 0; text-align: left; display: grid; grid-template-rows: auto 1fr; }
.excard .stage { background: var(--st-wall); }
.excard .tx { padding: 8px 10px 10px; display: grid; gap: 3px; }
.excard .nm { font-weight: 700; font-size: 14px; line-height: 1.25; }
.excard .mu { font-size: 12px; color: var(--ink-2); }

/* Sheet (Übungsdetail / Advent) */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; background: rgb(0 0 0 / 0.45); }
.sheet[hidden] { display: none !important; }
.sheet .panel { width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet .bar { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.sheet h2 { font-size: 36px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.sheet .stagebox { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--st-wall); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; font-size: 20px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; line-height: 1; }
.tipbox { background: var(--green-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.tipbox b { color: var(--green); }

/* Dart */
.dartwrap { display: grid; gap: 14px; }
.board { width: 100%; max-width: 420px; margin: 0 auto; display: block; touch-action: manipulation; }
.board .seg { cursor: pointer; transition: opacity 0.12s; }
.board .seg:hover { opacity: 0.82; }
.board .lbl { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: #F4F1EA; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.board .mark { fill: #FFD84A; stroke: #1B1C1F; stroke-width: 2.5; pointer-events: none; }
.darts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 108px; display: grid; gap: 2px; align-content: start; text-align: left; }
.dart .sc { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; }
.dart .sc small { font-size: 15px; color: var(--ink-2); }
.dart .ex { font-size: 13px; font-weight: 700; line-height: 1.25; }
.dart .rp { font-size: 12px; color: var(--ink-2); }
.dart.empty { border-style: dashed; color: var(--ink-2); place-content: center; text-align: center; font-size: 13px; }
.dart.done { background: var(--green-soft); border-color: transparent; }
.dart-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; font-size: 13px; }
.legend div { display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.legend b { font-family: var(--font-display); font-size: 17px; text-align: right; color: var(--red); line-height: 1.2; }

/* Advent */
.adv-head { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.adv-head .big { font-family: var(--font-display); font-weight: 900; font-size: 72px; line-height: 0.85; color: var(--red); font-variant-numeric: tabular-nums; }
.adv-photo { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.adv-photo img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; display: block; }
.adv-photo span { font-size: 14px; color: var(--ink-2); }
.doors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.door { aspect-ratio: 1 / 1.1; border-radius: 10px; border: 0; background: #23252A; color: #F2E9D6; position: relative; overflow: hidden; display: grid; place-items: center; padding: 0; }
.door:nth-child(3n+1) { background: #2B1F1A; } .door:nth-child(4n+2) { background: #1F2622; }
.door .n { font-family: "Georgia", serif; font-style: italic; font-size: 30px; line-height: 1; }
.door .lock { position: absolute; right: 7px; bottom: 6px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.65; }
.door.open { background: var(--red); color: #fff; }
.door.done { background: var(--green); color: #fff; }
.door.done::after { content: "✓"; position: absolute; right: 8px; top: 4px; font-weight: 700; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.toast[hidden] { display: none !important; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .row { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--red); }

/* Video player (immer dunkel) */
.player { position: fixed; inset: 0; z-index: 80; background: #0F1012; color: #F1F1EE; display: grid; grid-template-rows: auto auto 1fr; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); gap: 10px; color-scheme: dark;

<script>
/* MöbelFit – Figur, Kinematik und Requisiten (Seitenansicht).
   Bühne: viewBox 0 0 400 300, Boden bei y = 250. 1 Einheit ≈ 1 cm. */

const FIG = { torso: 62, neck: 20, head: 13, thigh: 46, shin: 44, upper: 35, fore: 34, foot: 15 };
const D2R = Math.PI / 180;
const FLOOR = 250;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
const r1 = (n) => Math.round(n * 10) / 10;

/* Zwei-Knochen-IK: Basis a, Ziel t, Längen l1/l2, Beugerichtung s (-1 / +1). */
function ik(a, t, l1, l2, s) {
  const dx = t[0] - a[0], dy = t[1] - a[1];
  const d = Math.hypot(dx, dy) || 0.0001;
  const dc = clamp(d, Math.abs(l1 - l2) + 0.01, l1 + l2 - 0.01);
  const ux = dx / d, uy = dy / d;
  const cosA = clamp((l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc), -1, 1);
  const ang = s * Math.acos(cosA);
  const c = Math.cos(ang), sn = Math.sin(ang);
  const j = [a[0] + l1 * (ux * c - uy * sn), a[1] + l1 * (ux * sn + uy * c)];
  const ex = t[0] - j[0], ey = t[1] - j[1];
  const el = Math.hypot(ex, ey) || 0.0001;
  return [j, [j[0] + (l2 * ex) / el, j[1] + (l2 * ey) / el]];
}

/* Gerader Körper (Plank-Linie) ab Knöchel unter Winkel beta (Grad über der Horizontalen). */
function bodyLine(ankle, beta, dir = 1) {
  const r = beta * D2R;
  const ux = Math.cos(r) * dir, uy = -Math.sin(r);
  const hip = [ankle[0] + 89 * ux, ankle[1] + 89 * uy];
  const sh = [hip[0] + 62 * ux, hip[1] + 62 * uy];
  return { hip, sh };
}

function pair(v, offFar = -4, offNear = 2) {
  if (typeof v[0] === "number") return [[v[0] + offFar, v[1]], [v[0] + offNear, v[1]]];
  return v;
}

function normPose(p) {
  const q = Object.assign({ hd: 0, ft: [0, 0], kb: [-1, -1], eb: [1, 1], off: [0, 0] }, p);
  if (p.sh) q.t = Math.atan2(p.sh[0] - p.hip[0], -(p.sh[1] - p.hip[1])) / D2R;
  if (q.t === undefined) q.t = 0;
  q.f = pair(p.f);
  q.h = pair(p.h, -3, 2);
  if (typeof q.ft === "number") q.ft = [q.ft, q.ft];
  return q;
}

function lerpPose(a, b, t) {
  const L2 = (x, y) => [lerp(x[0], y[0], t), lerp(x[1], y[1], t)];
  return {
    hip: L2(a.hip, b.hip), t: lerp(a.t, b.t, t), hd: lerp(a.hd, b.hd, t),
    f: [L2(a.f[0], b.f[0]), L2(a.f[1], b.f[1])],
    h: [L2(a.h[0], b.h[0]), L2(a.h[1], b.h[1])],
    ft: [lerp(a.ft[0], b.ft[0], t), lerp(a.ft[1], b.ft[1], t)],
    kb: t < 0.5 ? a.kb : b.kb, eb: t < 0.5 ? a.eb : b.eb,
    off: L2(a.off, b.off),
  };
}

function solvePose(p) {
  const o = p.off;
  const hip = [p.hip[0] + o[0], p.hip[1] + o[1]];
  const tr = p.t * D2R;
  const sh = [hip[0] + FIG.torso * Math.sin(tr), hip[1] - FIG.torso * Math.cos(tr)];
  const hr = (p.t + p.hd) * D2R;
  const nk = FIG.neck + FIG.head - 4;
  const head = [sh[0] + nk * Math.sin(hr), sh[1] - nk * Math.cos(hr)];
  const J = { hip, sh, head, t: p.t + p.hd, knee: [], ankle: [], toe: [], elbow: [], hand: [] };
  for (let i = 0; i < 2; i++) {
    const fx = [p.f[i][0] + o[0], p.f[i][1] + o[1]];
    const [k, an] = ik(hip, fx, FIG.thigh, FIG.shin, p.kb[i]);
    const fa = p.ft[i] * D2R;
    J.knee.push(k); J.ankle.push(an);
    J.toe.push([an[0] + FIG.foot * Math.cos(fa), an[1] + FIG.foot * Math.sin(fa)]);
    const hx = [p.h[i][0] + o[0], p.h[i][1] + o[1]];
    const [e, hd] = ik(sh, hx, FIG.upper, FIG.fore, p.eb[i]);
    J.elbow.push(e); J.hand.push(hd);
  }
  return J;
}

/* Animation: keys werden zyklisch durchlaufen; move[i]/hold[i] in Sekunden. */
function prepAnim(ex) {
  if (ex._prep) return ex._prep;
  const A = ex.anim;
  const keys = A.keys.map(normPose);
  const n = keys.length;
  const move = A.move || keys.map(() => 1);
  const hold = A.hold || keys.map(() => 0.2);
  const total = move.reduce((s, v, i) => s + v + hold[i], 0);
  ex._prep = { keys, move, hold, total, n };
  return ex._prep;
}

function poseAt(ex, time) {
  const P = prepAnim(ex);
  let tt = ((time % P.total) + P.total) % P.total;
  const phase = tt / P.total;
  for (let i = 0; i < P.n; i++) {
    const a = P.keys[i], b = P.keys[(i + 1) % P.n];
    if (tt < P.move[i]) return { pose: lerpPose(a, b, ease(tt / P.move[i])), phase };
    tt -= P.move[i];
    if (tt < P.hold[i]) return { pose: lerpPose(b, b, 0), phase };
    tt -= P.hold[i];
  }
  return { pose: lerpPose(P.keys[0], P.keys[0], 0), phase };
}

/* ---------- Zeichnen ---------- */
const pts = (arr) => arr.map((p) => r1(p[0]) + "," + r1(p[1])).join(" ");

function figureSVG(J) {
  const limb = (a, b, c, cls) => `<polyline class="${cls}" points="${pts([a, b, c])}"/>`;
  const foot = (i, cls) => `<line class="${cls}" x1="${r1(J.ankle[i][0])}" y1="${r1(J.ankle[i][1])}" x2="${r1(J.toe[i][0])}" y2="${r1(J.toe[i][1])}"/>`;
  const fx = Math.cos(J.t * D2R), fy = Math.sin(J.t * D2R); // Blickrichtung
  const hx = J.head[0], hy = J.head[1];
  return [
    limb(J.sh, J.elbow[0], J.hand[0], "fa-far"),
    limb(J.hip, J.knee[0], J.ankle[0], "fl-far"), foot(0, "ff-far"),
    `<line class="ftorso" x1="${r1(J.hip[0])}" y1="${r1(J.hip[1])}" x2="${r1(J.sh[0])}" y2="${r1(J.sh[1])}"/>`,
    `<circle class="fhip" cx="${r1(J.hip[0])}" cy="${r1(J.hip[1])}" r="11.5"/>`,
    limb(J.hip, J.knee[1], J.ankle[1], "fl-near"), foot(1, "ff-near"),
    `<circle class="fhair" cx="${r1(hx - fx * 2.2)}" cy="${r1(hy - fy * 2.2)}" r="13.4"/>`,
    `<circle class="fface" cx="${r1(hx + fx * 1.6)}" cy="${r1(hy + fy * 1.6)}" r="11.6"/>`,
    limb(J.sh, J.elbow[1], J.hand[1], "fa-near"),
    `<circle class="fhand" cx="${r1(J.hand[1][0])}" cy="${r1(J.hand[1][1])}" r="5"/>`,
  ].join("");
}

/* Requisiten. x = Bezugskante, flip spiegelt um x. */
const PROPS = {
  chair({ x, flip }) {
    const g = `<g ${flip ? `transform="translate(${2 * x} 0) scale(-1 1)"` : ""}>
      <rect class="p-wood-far" x="${x + 13}" y="205" width="4.5" height="45" rx="2"/>
      <rect class="p-wood-far" x="${x - 15}" y="205" width="4.5" height="45" rx="2"/>
      <rect class="p-wood" x="${x + 18}" y="205" width="5" height="45" rx="2"/>
      <rect class="p-wood" x="${x - 22}" y="205" width="5" height="45" rx="2"/>
      <rect class="p-uph" x="${x - 26}" y="128" width="11" height="80" rx="5"/>
      <rect class="p-uph" x="${x - 24}" y="196" width="50" height="11" rx="4"/>
    </g>`;
    return g;
  },
  sofa({ x, flip }) {
    // x = vordere Sitzkante; Sofa liegt links davon (flip: rechts)
    return `<g ${flip ? `transform="translate(${2 * x} 0) scale(-1 1)"` : ""}>
      <rect class="p-sofa-d" x="${x - 92}" y="208" width="94" height="34" rx="6"/>
      <rect class="p-wood-d" x="${x - 86}" y="242" width="6" height="8" rx="1"/>
      <rect class="p-wood-d" x="${x - 8}" y="242" width="6" height="8" rx="1"/>
      <rect class="p-sofa-d" x="${x - 96}" y="132" width="26" height="80" rx="10"/>

/* Dynamische Anhänge (hängen an Gelenken). */
const ATT = {
  db(J) { // Kurzhantel in der vorderen Hand (Stirnansicht)
    const [x, y] = J.hand[1];
    return `<rect class="a-db" x="${r1(x - 9)}" y="${r1(y - 9)}" width="18" height="18" rx="5"/><circle class="a-db-hi" cx="${r1(x)}" cy="${r1(y)}" r="4"/>`;
  },
  dbv(J) { // senkrecht (Goblet)
    const [x, y] = J.hand[1];
    return `<rect class="a-db" x="${r1(x - 8)}" y="${r1(y - 2)}" width="16" height="9" rx="3"/><rect class="a-db" x="${r1(x - 3)}" y="${r1(y + 6)}" width="6" height="14"/><rect class="a-db" x="${r1(x - 8)}" y="${r1(y + 18)}" width="16" height="9" rx="3"/>`;
  },
  dbhip(J) { // Hantel auf der Hüfte
    const [x, y] = J.hip;
    return `<rect class="a-db" x="${r1(x - 9)}" y="${r1(y - 22)}" width="18" height="16" rx="5"/><circle class="a-db-hi" cx="${r1(x)}" cy="${r1(y - 14)}" r="3.5"/>`;
  },
  towel(J) { // Handtuch unter beiden Füßen
    return [0, 1].map((i) => {
      const [x] = J.ankle[i];
      return `<rect class="a-towel" x="${r1(x - 10)}" y="245" width="34" height="6" rx="2"/><line class="a-towel-s" x1="${r1(x - 6)}" y1="248" x2="${r1(x + 20)}" y2="248"/>`;
    }).join("");
  },
  towelheel(J) {
    const x = (J.ankle[0][0] + J.ankle[1][0]) / 2;
    return `<rect class="a-towel" x="${r1(x - 18)}" y="245" width="36" height="6" rx="2"/><line class="a-towel-s" x1="${r1(x - 14)}" y1="248" x2="${r1(x + 14)}" y2="248"/>`;
  },
  towelrear(J) {
    const [x] = J.ankle[0];
    return `<rect class="a-towel" x="${r1(x - 6)}" y="245" width="32" height="6" rx="2"/><line class="a-towel-s" x1="${r1(x - 2)}" y1="248" x2="${r1(x + 22)}" y2="248"/>`;
  },
  pillow(J) {
    const [x, y] = J.knee[1];
    return `<g transform="rotate(${r1(J.t + 90)} ${r1(x)} ${r1(y)})"><rect class="a-pillow" x="${r1(x - 13)}" y="${r1(y - 8)}" width="26" height="16" rx="6"/>
      <line class="a-pillow-s" x1="${r1(x + 4)}" y1="${r1(y - 7)}" x2="${r1(x + 4)}" y2="${r1(y + 7)}"/></g>`;
  },
  pillowhead(J) {
    const [x, y] = J.head;
    return `<rect class="a-pillow" x="${r1(x - 16)}" y="${r1(Math.min(y + 8, 240))}" width="32" height="10" rx="4"/>`;
  },
  banddoor(J, ex) {
    const ax = ex.anchor || 330, ay = 151;
    return [0, 1].map((i) => `<line class="${i ? "a-band" : "a-band2"}" x1="${ax}" y1="${ay}" x2="${r1(J.hand[i][0])}" y2="${r1(J.hand[i][1])}"/>`).join("") +
      [0, 1].map((i) => `<rect class="a-grip" x="${r1(J.hand[i][0] - 3)}" y="${r1(J.hand[i][1] - 7)}" width="6" height="14" rx="3"/>`).join("");
  },
  bandfoot(J) {
    return [0, 1].map((i) => {
      const a = J.ankle[i], h = J.hand[i];
      const mx = (a[0] + h[0]) / 2 + 10, my = (a[1] + h[1]) / 2;
      return `<path class="${i ? "a-band" : "a-band2"}" d="M${r1(a[0] + 6)} ${r1(a[1] + 3)} Q${r1(mx)} ${r1(my)} ${r1(h[0])} ${r1(h[1])}" fill="none"/>`;
    }).join("") + `<rect class="a-grip" x="${r1(J.hand[1][0] - 3)}" y="${r1(J.hand[1][1] - 7)}" width="6" height="14" rx="3"/>`;
  },
  rope(J, ex, phase) {
    const h = J.hand[1];
    const cx = J.hip[0] - 2, cy = 146, rx = 66, ry = 102;
    const th = 90 + 360 * (phase - 0.5);
    const pts2 = [];
    for (let a = th - 75; a <= th + 75.1; a += 15) {
      const r = a * D2R;
      pts2.push([cx + rx * Math.cos(r), cy + ry * Math.sin(r)]);
    }
    const d = "M" + r1(h[0]) + " " + r1(h[1]) + " L" + pts2.map((p) => r1(p[0]) + " " + r1(p[1])).join(" L") + " L" + r1(h[0] - 3) + " " + r1(h[1]);
    return `<path class="a-rope" d="${d}" fill="none"/>
      <rect class="a-ropeh" x="${r1(h[0] - 3)}" y="${r1(h[1] - 9)}" width="6" height="16" rx="2.5"/>`;
  },
};

function stageBG(opts = {}) {
  let s = `<rect class="st-wall" x="0" y="0" width="400" height="250"/>
    <rect class="st-floor" x="0" y="250" width="400" height="50"/>
    <rect class="st-base" x="0" y="244" width="400" height="6"/>`;
  for (let i = 0; i < 7; i++) {
    const x = 20 + i * 62 + (i % 2) * 9;
    s += `<line class="st-seam" x1="${x}" y1="252" x2="${x - 14}" y2="300"/>`;
  }
  s += `<line class="st-seam" x1="0" y1="268" x2="400" y2="268"/><line class="st-seam" x1="0" y1="286" x2="400" y2="286"/>`;
  return s;
}

/* Komplette Szene einer Übung zur Zeit t (Sekunden). */
function sceneSVG(ex, time) {
  const { pose, phase } = poseAt(ex, time);
  const J = solvePose(pose);
  const back = (ex.props || []).filter((p) => !p.front).map((p) => PROPS[p.type](p)).join("");
  const front = (ex.props || []).filter((p) => p.front).map((p) => PROPS[p.type](p)).join("");
  const under = (ex.att || []).filter((a) => a.startsWith("towel") || a === "pillowhead").map((a) => ATT[a](J, ex, phase)).join("");
  const over = (ex.att || []).filter((a) => !(a.startsWith("towel") || a === "pillowhead")).map((a) => ATT[a](J, ex, phase)).join("");
  const shx = (J.hip[0] + (J.ankle[0][0] + J.ankle[1][0]) / 2) / 2;
  const shadow = `<ellipse class="st-shadow" cx="${r1(shx)}" cy="251" rx="56" ry="4.5"/>`;
  return back + shadow + under + figureSVG(J) + over + front;
}

function staticStage(ex) {
  return stageBG();
}

/* Zeitachse eines Workouts für den Video-Player. */
function buildTimeline(w) {
  const segs = [];
  const first = EX[w.warmup ? "march" : w.items[0][0]];
  segs.push({ kind: "prep", ex: first, dur: 10 });
  if (w.warmup) segs.push({ kind: "work", ex: EX.march, dur: w.warmup, round: 0, label: "Aufwärmen" });
  for (let r = 1; r <= w.rounds; r++) {
    w.items.forEach(([id, secs], i) => {
      const ex = EX[id];
      const sides = ex.sides ? ["rechts", "links"] : [null];
      sides.forEach((side, si) => {
        const prev = segs[segs.length - 1];
        if (prev.kind === "work") {
          const isRoundBreak = i === 0 && si === 0 && r > 1;
          const rest = isRoundBreak ? w.roundRest || w.rest : (si === 1 ? Math.min(w.rest, 10) : w.rest);
          segs.push({ kind: "rest", ex, dur: rest, round: r, side, roundBreak: isRoundBreak });
        }
        segs.push({ kind: "work", ex, dur: secs, round: r, side });
      });
    });
  }
  let t = 0;
  segs.forEach((s) => { s.start = t; t += s.dur; });
  return { segs, total: t, rounds: w.rounds };
}

  const fmtTime = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const levelDots = (n) => `<span class="lvl" aria-label="Level ${n} von 3">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
  const LEVEL = ["", "Einsteiger", "Mittel", "Fortgeschritten"];

  /* ---------- Speicher: Browser + (falls vorhanden) privates Claude-db ---------- */
  const Store = {
    data: { entries: [], advent: [] },
    ref: null, migrated: false,
    load() {
      try { const raw = localStorage.getItem("moebelfit.v1"); if (raw) Object.assign(this.data, JSON.parse(raw)); } catch (e) { /* leer */ }
    },
    saveLocal() { try { localStorage.setItem("moebelfit.v1", JSON.stringify(this.data)); } catch (e) { /* ignorieren */ } },
    async connect() {
      try {
        if (!window.claude || !window.claude.use) return;
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        this.ref = db.doc("data/users/" + id + "/moebelfit");
        this.ref.onSnapshot((snap) => {
          const remote = snap.exists ? snap.data() : { entries: [], advent: [] };
          const changed = this.merge(remote);
          if (changed.local) { this.saveLocal(); refresh(); }
          if (changed.remoteMissing && !this.migrated && !snap.metadata.fromCache) {
            this.migrated = true;
            setTimeout(() => this.push(), 400);
          }
        }, () => { this.ref = null; });
      } catch (e) { this.ref = null; }
    },
    merge(remote) {
      const ids = new Set(this.data.entries.map((e) => e.id));
      const rids = new Set((remote.entries || []).map((e) => e.id));
      let local = false;
      (remote.entries || []).forEach((e) => { if (!ids.has(e.id)) { this.data.entries.push(e); local = true; } });
      (remote.advent || []).forEach((d) => { if (!this.data.advent.includes(d)) { this.data.advent.push(d); local = true; } });
      const remoteMissing = this.data.entries.some((e) => !rids.has(e.id)) || this.data.advent.some((d) => !(remote.advent || []).includes(d));
      this.data.entries.sort((a, b) => a.date.localeCompare(b.date));
      return { local, remoteMissing };
    },
    async push() {
      if (!this.ref) return;
      try { await this.ref.set({ entries: this.data.entries.slice(-400), advent: this.data.advent, v: 1 }); } catch (e) { /* offline */ }
    },
    async addEntry(entry) {
      this.data.entries.push(entry);
      this.data.entries = this.data.entries.slice(-400);
      this.saveLocal(); refresh(); await this.push();
    },
    async toggleAdvent(day) {
      const a = this.data.advent;
      const i = a.indexOf(day);
      if (i >= 0) a.splice(i, 1); else a.push(day);
      this.saveLocal(); refresh(); await this.push();
    },
  };

  /* ---------- Animierte Bühnen ---------- */
  const Anim = {
    visible: new Set(),
    io: "IntersectionObserver" in window ? new IntersectionObserver((ents) => {
      ents.forEach((e) => { if (e.isIntersecting) Anim.visible.add(e.target); else Anim.visible.delete(e.target); });
    }, { rootMargin: "60px" }) : null,
    last: 0,
    draw(svg, t) {
      const ex = EX[svg.dataset.ex];
      if (!ex) return;
      const inner = staticStage(ex) + sceneSVG(ex, t + (+svg.dataset.off || 0));
      svg.innerHTML = svg.dataset.mirror === "1" ? `<g transform="translate(400 0) scale(-1 1)">${inner}</g>` : inner;
    },
    restTime(ex) { const P = prepAnim(ex); return P.move[0] + P.hold[0] * 0.5; },
    scan(root) {
      $$("svg.stage[data-ex]", root).forEach((svg, i) => {
        if (!svg.dataset.off) svg.dataset.off = String((i * 0.37) % 2);
        this.draw(svg, this.restTime(EX[svg.dataset.ex]));
        if (!reduceMotion) { if (this.io) this.io.observe(svg); else this.visible.add(svg); }
      });
    },
    tick(ts) {
      if (ts - Anim.last > 33) {
        Anim.last = ts;
        Anim.visible.forEach((svg) => { if (!svg.isConnected) { Anim.visible.delete(svg); return; } Anim.draw(svg, ts / 1000); });
      }
      requestAnimationFrame(Anim.tick);
    },
  };
  const stage = (exId, extra = "") => `<svg class="stage" viewBox="0 0 400 300" data-ex="${exId}" ${extra} role="img" aria-label="Animation: ${esc(EX[exId].name)}"></svg>`;

  /* ---------- Icons für Geräte (falls kein Foto) ---------- */

  const RECO = ["erster-schritt", "stuhl-zirkel", "kuechen-kraft", "sofa-po", "band-hantel", "sieben-minuten", "wohnzimmer-hiit"];
  const kcalOf = (segs) => Math.round(segs.reduce((s, g) => s + (g.kind === "work" ? (g.ex.met || 4) : 2) * 1.225 * (g.done ?? g.dur) / 60, 0));

  /* ---------- Statistik ---------- */
  function weekInfo() {
    const d = now();
    const dow = (d.getDay() + 6) % 7; // Mo = 0
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    const days = [];
    for (let i = 0; i < 7; i++) days.push(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
    const keys = days.map(dayKey);
    const ents = Store.data.entries.filter((e) => keys.includes(e.date.slice(0, 10)));
    const set = new Set(Store.data.entries.map((e) => e.date.slice(0, 10)));
    let streak = 0;
    const c = new Date(d);
    if (!set.has(dayKey(c))) c.setDate(c.getDate() - 1);
    while (set.has(dayKey(c))) { streak++; c.setDate(c.getDate() - 1); }
    const onejan = new Date(d.getFullYear(), 0, 4);
    const kw = 1 + Math.round(((mon - onejan) / 864e5 + ((onejan.getDay() + 6) % 7)) / 7);
    return { days, keys, ents, streak, kw, mins: Math.round(ents.reduce((s, e) => s + e.secs, 0) / 60), active: new Set(ents.map((e) => e.date.slice(0, 10))) };
  }

  /* ---------- Ansicht: Dart ---------- */
  const dartState = { darts: [] };
  function boardSVG() {
    const R = { dO: 170, dI: 160, tO: 107, tI: 97, ob: 16, b: 6.4 };
    const arc = (r0, r1, a0, a1) => {
      const p = (r, a) => `${(r * Math.cos(a * D2R)).toFixed(2)} ${(r * Math.sin(a * D2R)).toFixed(2)}`;
      return `M${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)}Z`;
    };
    let s = `<circle r="200" fill="var(--board)"/>`;
    DART_ORDER.forEach((n, i) => {
      const a0 = -90 - 9 + 18 * i, a1 = a0 + 18;
      const single = i % 2 === 0 ? "#1B1C1F" : "#EFE4CC";
      const ring = i % 2 === 0 ? "#C8322D" : "#17784A";
      s += `<path class="seg" data-n="${n}" data-m="2" d="${arc(R.dI, R.dO, a0, a1)}" fill="${ring}"/>`;
      s += `<path class="seg" data-n="${n}" data-m="1" d="${arc(R.tO, R.dI, a0, a1)}" fill="${single}"/>`;
      s += `<path class="seg" data-n="${n}" data-m="3" d="${arc(R.tI, R.tO, a0, a1)}" fill="${ring}"/>`;
      s += `<path class="seg" data-n="${n}" data-m="1" d="${arc(R.ob, R.tI, a0, a1)}" fill="${single}"/>`;
      const la = (a0 + 9) * D2R;
      s += `<text class="lbl" x="${(186 * Math.cos(la)).toFixed(1)}" y="${(186 * Math.sin(la)).toFixed(1)}">${n}</text>`;
    });
    s += `<circle class="seg" data-n="25" data-m="1" r="${R.ob}" fill="#17784A"/><circle class="seg" data-n="50" data-m="1" r="${R.b}" fill="#C8322D"/>`;
    s += `<g stroke="#9C9A93" stroke-width="0.8" fill="none" pointer-events="none"><circle r="${R.dO}"/><circle r="${R.dI}"/><circle r="${R.tO}"/><circle r="${R.tI}"/></g>`;
    s += dartState.darts.filter((d) => d.x !== undefined).map((d) => `<circle class="mark" cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="7"/>`).join("");
    return `<svg class="board" id="board" viewBox="-205 -205 410 410" role="img" aria-label="Dartscheibe zum Antippen">${s}</svg>`;
  }
  function dartTask(n, m) {
    if (n === 0) return { title: "Daneben", ex: "towel-mountain", text: "20 s Bergsteiger", secs: 20 };
    if (n === 50) return { title: "Bullseye!", joker: true, text: "Joker: Streich eine Aufgabe dieser Runde." };
    if (n === 25) return { title: "Bull", ex: "wall-sit", text: "25 s Wandsitzen", secs: 25 };
    const ex = EX[DART_MAP[n]];
    const reps = n * m;
    return { title: (m === 3 ? "T" : m === 2 ? "D" : "") + n, ex: ex.id, reps, text: `${reps} × ${ex.name}${ex.sides ? " pro Seite" : ""}` };
  }
  function renderDart() {
    const ds = dartState.darts;
    const pts = ds.reduce((s, d) => s + (d.n === 50 || d.n === 25 ? d.n : d.n * d.m), 0);
    $("#v-dart").innerHTML = `
      <section class="sec">
        <div class="sec-head"><h2>Dart-Roulette</h2><span class="muted num">${pts} Punkte</span></div>
        <p class="muted">Wirf drei Pfeile auf deine Scheibe und tippe hier an, wo sie stecken. Die Zahl ist deine Wiederholungszahl. Double zählt doppelt, Triple dreifach.</p>
      </section>
      <div class="dartwrap">
        ${boardSVG()}
        <div class="darts">${[0, 1, 2].map((i) => {
          const d = ds[i];
          if (!d) return `<div class="dart empty">Pfeil ${i + 1}<br>tippe auf die Scheibe</div>`;
          const t = dartTask(d.n, d.m);
          return `<button class="dart" ${t.ex ? `data-ex="${t.ex}"` : ""}><div class="sc">${esc(t.title)}</div><div class="ex">${esc(t.ex ? EX[t.ex].name : "Joker")}</div><div class="rp">${esc(t.text)}</div></button>`;
        }).join("")}</div>
        <div class="dart-actions">
          <button class="btn" id="dart-miss" ${ds.length >= 3 ? "disabled" : ""}>Daneben</button>
          <button class="btn ghost" id="dart-undo" ${ds.length ? "" : "disabled"}>Rückgängig</button>
          <button class="btn red" id="dart-play" ${ds.length === 3 ? "" : "disabled"}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Runde als Video</button>

          <div><b>25</b><span>Bull: Wandsitzen</span></div><div><b>50</b><span>Bullseye: Joker</span></div><div><b>0</b><span>Daneben: Bergsteiger</span></div></div>

  }
  function addDart(n, m, x, y) {

  function dartTimeline() {

    segs.push({ kind: "prep", ex: EX[tasks[0].ex], dur: 8 });
    tasks.forEach((t, i) => {
      const ex = EX[t.ex];
      const sides = t.reps && ex.sides ? ["rechts", "links"] : [null];
      sides.forEach((side) => {
        if (segs[segs.length - 1].kind === "work") segs.push({ kind: "rest", ex, dur: 20, side, round: 1 });
        segs.push(t.reps ? { kind: "work", ex, reps: t.reps, dur: Math.max(20, t.reps * 2.5), side, round: 1 } : { kind: "work", ex, dur: t.secs, side, round: 1 });

  /* ---------- Ansicht: Advent ---------- */
  const DOOR_ORDER = [12, 7, 19, 3, 22, 9, 15, 1, 18, 5, 24, 11, 2, 16, 8, 21, 13, 4, 20, 10, 6, 17, 23, 14];

  function openDoor(n) {

      <div class="stagebox">${stage(ex.id)}</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${w ? `<button class="btn red" data-play="${w.id}">Video starten</button>` : `<button class="btn red" data-try="${ex.id}">Mitmachen</button><button class="btn" data-ex="${ex.id}">Anleitung</button>`}

  }

  /* ---------- Sheet ---------- */
  const closeBtn = `<button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

  function openExercise(id) {

      ${inW.length ? `<div class="sec"><div class="eyebrow">Kommt vor in</div><div class="chips">${inW.map((w) => `<button class="chip" data-play="${w.id}">▶ ${esc(w.title)}</button>`).join("")}</div></div>` : ""}`);

  function tryTimeline(id) {

  /* ---------- Toast ---------- */
  let toastT = 0;

  /* ---------- Video-Player ---------- */
  const Player = {
    tl: null, meta: null, idx: 0, lt: 0, playing: false, voice: true, render: false, raf: 0, lastTs: 0, wake: null, ac: null, spoken: {},
    open(tl, meta, opts = {}) {

      $("#pl-finish").hidden = true; $("#pl-confirm").hidden = true;
      $("#player").hidden = false;

    close() {

    },
    seg() { return this.tl.segs[this.idx]; },
    loop(ts) {

    },
    advance(dt) {

      this.lt += dt; this.elapsed += dt;
      if (!s.reps) {
        const rem0 = s.dur - before, rem1 = s.dur - this.lt;
        [3, 2, 1].forEach((k) => { if (rem0 > k && rem1 <= k) this.beep(660, 0.12); });

    prev() {

    },
    nextWork(from) { for (let i = from + 1; i < this.tl.segs.length; i++) if (this.tl.segs[i].kind === "work") return this.tl.segs[i]; return null; },
    sideWord(side) { return side ? `, ${side === "rechts" ? "rechte" : "linke"} Seite` : ""; },
    enter() {
      const s = this.seg(); if (!s || this.render) return;

      if (this.spoken[this.idx]) return;

      } else {
        this.beep(990, 0.35);
        this.say(s.reps ? `${s.ex.name}${this.sideWord(s.side)}. ${s.reps} Wiederholungen.` : `Los! ${s.ex.name}${this.sideWord(s.side)}.`);

    },
    beep(freq, len) {

    },
    toggle() {

    },
    finish() {
      this.playing = false;
      const segs = this.tl.segs;
      const work = segs.filter((s) => s.kind === "work" && s.done !== undefined);
      const secs = Math.round(this.render ? segs.reduce((s, g) => s + g.dur, 0) : this.elapsed);
      const kcal = kcalOf(segs.filter((s) => s.done !== undefined || this.render));
      const box = $("#pl-finish");
      const conf = reduceMotion || this.render ? "" : `<div class="confetti">${Array.from({ length: 40 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${["#E2463D", "#2EA368", "#EFE4CC", "#F1F1EE"][i % 4]};animation-delay:${(i % 10) * 0.12}s"></i>`).join("")}</div>`;

      const svg = $("#pl-stage");
      const mirror = s.side === "links";
      const inner = staticStage(showEx) + sceneSVG(showEx, s.kind === "work" ? this.lt : this.lt * 0.6);
      svg.innerHTML = mirror ? `<g transform="translate(400 0) scale(-1 1)">${inner}</g>` : inner;
      svg.style.opacity = s.kind === "work" ? 1 : 0.55;
      const badge = $("#pl-badge");
      const kindTxt = s.kind === "work" ? (s.label || (s.reps ? `× ${s.reps}` : "Los")) : s.kind === "rest" ? "Pause" : "Bereit machen";
      if (badge.textContent !== kindTxt) badge.textContent = kindTxt;
      badge.className = "pl-badge " + (s.kind === "work" ? "" : s.kind);
      const side = $("#pl-side");
      side.hidden = !s.side; if (s.side) side.textContent = s.side === "rechts" ? "Rechte Seite" : "Linke Seite";
      const name = s.kind === "work" ? s.ex.name : `Gleich: ${s.ex.name}`;
      if ($("#pl-name").textContent !== name) $("#pl-name").textContent = name;
      const cue = s.kind === "work" ? s.ex.cue : s.kind === "rest" ? (s.roundBreak ? `Runde ${s.round - 1} geschafft. Wasser trinken, gleich geht's weiter.` : "Durchatmen, Position einnehmen.") : `${segs.filter((x) => x.kind === "work").length} Sätze · ${fmtTime(segs.reduce((a, g) => a + (g.reps ? 30 : g.dur), 0))} Min`;
      if ($("#pl-cue").textContent !== cue) $("#pl-cue").textContent = cue;

      const nextTxt = s.kind === "work" ? (nx ? `<span>Als Nächstes:</span> <b>${esc(nx.ex.name)}${nx.side ? " (" + nx.side + ")" : ""}</b>` : "<b>Danach: geschafft!</b>")

    setTime(T) { // nur Render-Modus

  function playWorkout(id) {
    const w = WO[id];

  }

  /* ---------- Router & Events ---------- */
  const VIEWS = ["start", "workouts", "uebungen", "dart", "advent"];
  let current = "start";
  function show(v) {
    if (!VIEWS.includes(v)) v = "start";
    if (!$("#sheet").hidden) closeSheet();
    current = v;
    VIEWS.forEach((x) => { $("#v-" + x).hidden = x !== v; });
    $$(".tabs button").forEach((b) => { if (b.dataset.view === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    ({ start: renderStart, workouts: renderWorkouts, uebungen: renderUebungen, dart: renderDart, advent: renderAdvent })[v]();
  }
  function go(v) {
    if (location.hash !== "#" + v) location.hash = v; else show(v);
    window.scrollTo(0, 0);
  }
  function refresh() { if (!RENDER) show(current); }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button, a, [data-close]");
    if (!t) {
      if (ev.target === $("#sheet")) closeSheet();
      return;
    }
    if (t.closest(".tabs") && t.dataset.view) { go(t.dataset.view); return; }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    if (t.dataset.play) { ev.preventDefault(); closeSheet(); playWorkout(t.dataset.play); return; }
    if (t.dataset.try) { const e = EX[t.dataset.try]; closeSheet(); Player.open(tryTimeline(e.id), { id: "ex:" + e.id, title: e.name }); return; }
    if (t.dataset.adventDone) { const n = +t.dataset.adventDone; Store.toggleAdvent(n); closeSheet(); toast(Store.data.advent.includes(n) ? `Tür ${n} erledigt. Stark!` : `Tür ${n} wieder offen.`); return; }
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.filter) { exFilter = t.dataset.filter; try { localStorage.setItem("moebelfit.filter", exFilter); } catch (e) { /* egal */ } go("uebungen"); return; }
    if (t.dataset.f) { exFilter = t.dataset.f; try { localStorage.setItem("moebelfit.filter", exFilter); } catch (e) { /* egal */ } renderUebungen(); return; }

      case "dart-miss": addDart(0, 1); break;

      case "dart-play": { const tl = dartTimeline(); if (tl) Player.open(tl, { id: "dart", title: "Dart-Roulette", onDone: () => { dartState.darts = []; } }); else toast("Nur Joker getroffen: heute frei!"); break; }
      case "pl-play": Player.toggle(); break;
      case "pl-nextbtn": Player.next(); break;
      case "pl-prev": Player.prev(); break;
      case "pl-done": Player.next(); break;
      case "pl-voice": {
        Player.voice = !Player.voice;
        try { localStorage.setItem("moebelfit.voice", Player.voice ? "1" : "0"); } catch (e) { /* egal */ }
        t.setAttribute("aria-pressed", String(Player.voice)); $("#pl-voice .wave").style.opacity = Player.voice ? 1 : 0.15;
        if (!Player.voice) try { speechSynthesis.cancel(); } catch (e) { /* egal */ }
        break;
      }
      case "pl-close": if ($("#pl-finish").hidden) { Player.wasPlaying = Player.playing; Player.playing = false; $("#pl-confirm").hidden = false; $("#pl-stay").focus(); } else Player.close(); break;
      case "pl-stay": $("#pl-confirm").hidden = true; Player.playing = Player.wasPlaying; break;
      case "pl-quit": Player.close(); break;
      case "pl-finish-ok": Player.close(); refresh(); break;
    }
  });
  document.addEventListener("pointerdown", (ev) => {
    const seg = ev.target.closest && ev.target.closest("#board .seg");
    if (!seg) return;
    const svg = $("#board");
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    addDart(+seg.dataset.n, +seg.dataset.m, p.x, p.y);
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (!$("#player").hidden) { if (!$("#pl-confirm").hidden) { $("#pl-confirm").hidden = true; Player.playing = Player.wasPlaying; } else $("#pl-close").click(); ev.preventDefault(); }
      else if (!$("#sheet").hidden) { closeSheet(); ev.preventDefault(); }
    }
    if (ev.key === " " && !$("#player").hidden && ev.target === document.body) { Player.toggle(); ev.preventDefault(); }
  });
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  document.addEventListener("visibilitychange", () => { if (document.hidden && Player.playing && !$("#player").hidden) Player.toggle(); });

  /* ---------- Start ---------- */
  const d0 = now();
  $("#today-date").textContent = `${DAYS[d0.getDay()]}, ${d0.getDate()}. ${MONTHS[d0.getMonth()]}`;
  if (RENDER) {
    document.body.classList.add("render");
    let tl, meta;
    if (RENDER === "bibliothek") {
      const segs = EXERCISES.map((e) => ({ kind: "work", ex: e, dur: 6, round: 1 }));
      tl = { segs, rounds: 1 }; meta = { id: "bibliothek", title: "Übungs-Bibliothek" };
    } else if (RENDER.startsWith("ex:")) {
      tl = tryTimeline(RENDER.slice(3)); meta = { id: RENDER, title: EX[RENDER.slice(3)].name };
    } else {
      const w = WO[RENDER]; tl = timeline(w); meta = { id: w.id, title: w.title };
    }
    tl.segs.forEach((s) => { if (s.reps) { delete s.reps; } });
    Player.open(tl, meta, { render: true });
    window.__render = { total: tl.segs.reduce((a, g) => a + g.dur, 0), setTime: (T) => Player.setTime(T), segs: tl.segs.map((s) => ({ kind: s.kind, dur: s.dur })) };
  } else {
    Store.load();
    show(location.hash.slice(1) || "start");
    requestAnimationFrame(Anim.tick);
    Store.connect();
  }
})();

</script>
</body>
</html>
